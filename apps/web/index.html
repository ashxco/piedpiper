<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Pied Piper</title>
    <style>
      /* Startup failure card drawn by src/lib/bootError.ts; app CSS may never have loaded. */
      #boot-error {
        --boot-fg: #262626;
        --boot-bg: #ffffff;
        --boot-line: color-mix(in srgb, currentColor 14%, transparent);
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        overflow: auto;
        display: flex;
        justify-content: center;
        background: var(--boot-bg);
        color: var(--boot-fg);
        font:
          13px/20px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #boot-error {
          --boot-fg: #f5f5f5;
          --boot-bg: #0a0a0a;
        }
      }
      #boot-error .boot-error-card {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: min(440px, calc(100% - 32px));
        padding: clamp(24px, 20vh, 200px) 0 24px;
      }
      #boot-error h1 {
        margin: 0 0 4px;
        font-size: 18px;
        line-height: 26px;
        font-weight: 600;
      }
      #boot-error p {
        margin: 0;
        opacity: 0.75;
        overflow-wrap: anywhere;
      }
      #boot-error .boot-error-actions {
        display: flex;
        gap: 8px;
      }
      #boot-error button {
        height: 30px;
        padding: 0 12px;
        border: 1px solid var(--boot-line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      #boot-error button.boot-error-primary {
        border-color: var(--boot-fg);
        background: var(--boot-fg);
        color: var(--boot-bg);
      }
      #boot-error pre {
        max-height: 220px;
        margin: 0;
        padding: 10px 12px;
        overflow: auto;
        border: 1px solid var(--boot-line);
        border-radius: 6px;
        font:
          11px/16px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        white-space: pre-wrap;
        opacity: 0.8;
      }
      #boot-error :is(button, pre):focus-visible {
        outline: 2px solid var(--boot-fg);
        outline-offset: 2px;
      }
      #boot-error .boot-error-note {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
